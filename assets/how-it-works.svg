<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="hiw-title hiw-desc">
  <title id="hiw-title">How claude-setup works</title>
  <desc id="hiw-desc">A 16-second loop. detect.mjs scans the repo files, and the findings are assembled into one AGENTS.md. Claude Code (through CLAUDE.md), Codex, Cursor, Copilot, Gemini CLI, Aider, Windsurf and Zed then read that file. verify.mjs checks that the JSON is valid, there are no secrets, and the plan matches the files.</desc>
